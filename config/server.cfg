# ============================================================
#  Santa Aurora Roleplay — Configuração do Servidor
#  Arquivo: config/server.cfg
#  NOTA: Este arquivo é referência. As configurações reais
#        do SA-MP estão em server.cfg na raiz do servidor.
#        As configurações de banco estão em:
#        scriptfiles/db_config.ini
# ============================================================

[database]
host=127.0.0.1
port=3306
user=samp
password=samp_password
database=santa_aurora
charset=utf8mb4
pool_size=5

[server]
name=Santa Aurora - Roleplay Brasileiro
max_players=200
language=pt-BR
website=
announce=0
query=1
rcon_password=TROQUE_ESTA_SENHA

[economy]
starting_money=500
starting_bank=1000
tax_rate=0.05
max_money=2000000000
inflation_check_interval=3600

[gameplay]
afk_timeout=300
save_interval=300
login_max_attempts=5
chat_spam_delay=1500
cmd_spam_delay=500
interaction_range=2.5
local_chat_range=20.0

[anticheat]
enabled=1
max_speed=200
max_money_per_second=10000
log_suspicious=1
auto_ban=0

[backup]
enabled=1
interval_hours=6
retention_days=30

